name: karaoke-api

on:
  push:
    branches: [main]
    paths:
      - "src/karaoke/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "src/karaoke/**"
      - "tests/**"
      - "deploy/**"
      - "pyproject.toml"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    # The operational store is PostgreSQL, and tests/conftest.py opens a pool
    # at import time, so every test file needs a live server -- not just the
    # ones that touch the database. Credentials and database name must match
    # the KARAOKE_PG_URL that conftest sets.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: karaoke
          POSTGRES_PASSWORD: karaoke
          POSTGRES_DB: karaoke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karaoke -d karaoke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # The API tests only need the web stack plus the database driver; the
        # full project dependency set (whisper/torch/librosa) is not required
        # to exercise them.
        run: |
          python -m pip install --upgrade pip
          pip install pytest responses \
            "fastapi>=0.110.0" "uvicorn[standard]>=0.28.0" \
            "requests>=2.32" "rich>=13.7" httpx \
            "psycopg[binary,pool]>=3.0.0"

      - name: Run API and config tests
        # KARAOKE_PG_URL is deliberately not set here: tests/conftest.py pins it
        # to karaoke_test and overwrites the environment, so that a developer
        # whose shell points at a real database cannot have the clear_db
        # fixture truncate it. The service above must match that pinned value.
        env:
          PYTHONPATH: src
        run: pytest tests/test_api.py tests/test_config.py -v

  build:
    name: Build image and smoke-test on kind
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build library API image
        run: docker build -t karaoke-api:ci -f deploy/Dockerfile .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: karaoke-ci

      - name: Load image into kind
        run: kind load docker-image karaoke-api:ci --name karaoke-ci

      - name: Create the schema ConfigMap
        # The API no longer carries its own schema: POSTGRES_DDL in the
        # migration script is the single authority (tests/conftest.py parses
        # the same constant). Extract it and hand it to the Postgres
        # entrypoint, before the manifests so the pod sees it on first boot --
        # /docker-entrypoint-initdb.d only runs when the data directory is
        # initialised.
        #
        # Read the constant out of the source rather than importing it: the
        # migration script imports psycopg at module level, and this job
        # installs no Python dependencies.
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          python - <<'PY' > schema.sql
          import re
          src = open("scripts/migrate_sqlite_to_postgres.py").read()
          m = re.search(r'POSTGRES_DDL = """(.*?)"""', src, re.DOTALL)
          if not m:
              raise SystemExit("Could not find POSTGRES_DDL in the migration script")
          print(m.group(1))
          PY
          test -s schema.sql
          kubectl -n karaoke create configmap karaoke-schema --from-file=schema.sql

      - name: Deploy manifests
        run: |
          kubectl apply -k deploy/k8s
          kubectl -n karaoke rollout status deploy/postgres --timeout=180s
          kubectl -n karaoke set image deploy/karaoke-api api=karaoke-api:ci
          kubectl -n karaoke rollout status deploy/karaoke-api --timeout=180s

      - name: Smoke-test the API
        run: |
          kubectl -n karaoke port-forward svc/karaoke-api 8080:8000 &
          for i in $(seq 1 30); do
            if curl -sf -m 2 http://localhost:8080/health >/dev/null; then break; fi
            sleep 2
          done

          echo "--- /health ---"
          curl -sf -m 5 http://localhost:8080/health | tee /tmp/health.json
          grep -q '"status": *"ok"' /tmp/health.json

          echo "--- /api/tracks (empty DB is valid: expect an empty list) ---"
          curl -sf -m 5 http://localhost:8080/api/tracks | tee /tmp/tracks.json
          test "$(cat /tmp/tracks.json)" = "[]"

          echo "--- playback route must NOT exist in the deployed image ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 \
            -X POST http://localhost:8080/api/play \
            -H 'Content-Type: application/json' -d '{"url":"https://example.com"}')
          test "$code" = "404"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n karaoke get all,pvc || true
          kubectl -n karaoke describe pods || true
          kubectl -n karaoke logs -l app.kubernetes.io/name=karaoke-api --tail=100 || true
          kubectl -n karaoke logs -l app.kubernetes.io/name=postgres --tail=100 || true
