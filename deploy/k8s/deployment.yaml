apiVersion: apps/v1
kind: Deployment
metadata:
  name: karaoke-api
  namespace: karaoke
  labels:
    app.kubernetes.io/name: karaoke-api
    app.kubernetes.io/part-of: karaoke
spec:
  replicas: 1
  # The data volume is ReadWriteOnce: avoid a rolling update briefly binding
  # it twice. Track data itself now lives in Postgres, not on this volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: karaoke-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karaoke-api
        app.kubernetes.io/part-of: karaoke
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: karaoke-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KARAOKE_DATA_DIR
              value: /data
            - name: OPENSEARCH_URL
              value: http://opensearch-cluster-master.default.svc.cluster.local:9200
            # localcache reads this directly; without it the pool falls back to
            # localhost, which inside the pod is the pod itself.
            - name: KARAOKE_PG_URL
              value: postgresql://karaoke:karaoke@postgres.karaoke.svc.cluster.local:5432/karaoke
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karaoke-data
