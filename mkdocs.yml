site_name: Karaoke
site_description: Documentation for Local karaoke and lyric semantic search


site_url: https://github.com/violetina/karaoke
repo_url: https://github.com/violetina/karaoke
repo_name: violetina/karaoke

docs_dir: docs

theme:
  name: materialx
  logo: assets/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - monorepo
  - mkdocstrings:
      handlers:
        python:
          # The package lives under src/ and is not installed in the docs
          # environment; without this, a build outside the project venv
          # cannot resolve `karaoke` and --strict aborts on the first module.
          paths: [src]
          options:
            show_source: false
  - mermaid2:
      javascript: "https://unpkg.com/mermaid/dist/mermaid.min.js"
  - glightbox
  - mkdocs_graphviz

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
        - .
  - pymdownx.inlinehilite
  #- pymdownx.tabbed:
  #    alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

extra_javascript:
  - https://cdn.jsdelivr.net/gh/rod2ik/cdn@main/mkdocs/javascripts/mkdocs-graphviz.js

nav:
  - Overview: index.md
  - Quickstart runbook: howto-quickstart-runbook.md
  - Architecture: architecture.md
  - Services & Topology: platform-services.md
  - Storage & Data:
      - Database backend: database.md
      - Cache schema: cache-schema.md
      - Local cache and stats: local-cache-and-stats.md
      - Bulk ingestion: ingestion.md
  - API reference: api.md
  - Control API: control-api.md
  - Karaoke DJ & MCP: mcp-server.md
  - systemd services: howto-systemd-services.md
  - Post-processing: howto-post-processing.md
  - Event hooks: howto-events.md
  - Workflow poc: workflow.md
  - Makefile targets: makefile-targets.md
  - Flows: flows.md
  - The TUI: tui.md
  - Web TUI: web-tui.md
  - TUI visuals: tui-visuals.md
  - Modes:
      - Overview: modes/index.md
      - Scan: modes/scan.md
      - Spotify: modes/spotify.md
      - Browse: modes/browse.md
      - Radio: modes/radio.md
      - Record: modes/record.md
      - Sample: modes/sample.md
  - Browser cookies: browser-cookies.md
  - Search and weights: search.md
  - Vectors: vectors.md
  - Search how-to: search-howto.md
  - Troubleshooting: troubleshooting.md
  - Plans & Design:
      - Roadmap / TODO: todo.md
      - Vector search plan: vector-search-plan.md
      - Browse mode enhancements plan: browse_mode_enhancements_plan.md
      - Lyrics waterfall timed detection plan: lyrics_waterfall_timed_detection_plan.md
      - Chromecast dual playback plan: chromecast_dual_playback_and_two_part_experience_plan.md
      - Doc workflow plan: design/documentation-agent-workflow-plan.md
      - Events & Postgres migration plan: events_and_postgres_plan.md
      - Saved playlists Postgres migration plan: saved_playlists_postgres_migration_plan.md
      - TUI first concept: design/karaoke-tui-first-concept.md
  - Releases:
      - Version 0.9.0: releases/0.9.0.md
      - Version 0.8.0: releases/0.8.0.md
      - Version 0.7.0: releases/0.7.0.md
  - Tools:
      - karaoke: '!include ./src/karaoke/mkdocs.yml'

