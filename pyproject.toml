[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.9.1"
description = "Local karaoke + lyric semantic search over OpenSearch (kind cluster), LRCLIB synced lyrics."
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    "mutagen>=1.47",
    "faster-whisper>=1.2",
    "requests>=2.32",
    "rich>=13.7",
    "beautifulsoup4",
    "duckduckgo-search",
    "textual",
    "pyfiglet>=1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pika",
    "celery>=5.4",
    "flower>=2.0",
    "sqlalchemy>=2.0",
    "ytmusicapi>=1.12.0",
    "secretstorage>=3.3",
    "jeepney>=0.8",
    "psycopg[binary,pool]>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]
spotify = ["spotipy>=2.24"]
beats = ["librosa>=0.10", "soundfile>=0.12"]
youtube = ["yt-dlp>=2024.0"]
# Cross-platform (incl. Windows) fallback for live song identification when
# the Linux-only `songrec` binary isn't installed. See karaoke.identify_shazamio.
shazam = ["shazamio>=0.8"]
web = ["textual-serve>=1.1"]

[project.scripts]
karaoke = "karaoke.cli:karaoke_main"
karaoke-yt = "karaoke.cli:karaoke_yt_main"
lyricsearch = "karaoke.cli:lyricsearch_main"
music-index = "karaoke.cli:index_main"
karaoke-stage = "karaoke.cli:stage_main"
karaoke-player = "karaoke.cli:player_main"
karaoke-backfill = "karaoke.cli:backfill_main"
karaoke-folder-scan = "karaoke.cli:folder_scan_main"
karaoke-browse = "karaoke.cli:browse_main"
karaoke-api = "karaoke.api:main"
karaoke-ctrl-api = "karaoke.ctrl_api:main"
karaoke-vector-index = "karaoke.vector_index:vector_index_main"
karaoke-tui = "karaoke.cli:tui_main"
karaoke-analyze = "karaoke.cli:analyze_main"
karaoke-upgrade-timings = "karaoke.upgrade_timings:upgrade_main"
karaoke-postprocess-worker = "karaoke.postprocess_worker:main"
karaoke-relay = "karaoke.relay:main"
karaoke-spotify-playlist = "karaoke.spotify_playlist:playlist_main"
karaoke-find-sources = "karaoke.find_sources:find_sources_main"
karaoke-sample = "karaoke.sample_audio:sample_main"
karaoke-smartlist = "karaoke.smartlist:smartlist_main"
karaoke-recording = "karaoke.recording_worker:recording_main"
karaoke-lyrics-video = "karaoke.lyrics_video:main"
karaoke-align-review = "karaoke.lyric_align:review_main"
karaoke-similar = "karaoke.search:similar_main"
karaoke-sounds-like = "karaoke.search:describe_main"
karaoke-ytmusic-playlist = "karaoke.ytmusic_playlist:ytmusic_playlist_main"
karaoke-mcp = "karaoke.mcp_server:main"
karaoke-dj = "karaoke.dj_chat:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["karaoke*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]

[tool.pyrefly]
search-path = [".", "src"]


